name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Vet
        run: go vet ./...
        working-directory: backend

      - name: Test
        run: go test ./... -short -count=1
        working-directory: backend
        env:
          DATABASE_URL: postgres://localhost:5432/test?sslmode=disable

  frontend:
    runs-on: ubuntu-latest
    # next.config.mjs throws when NEXT_PUBLIC_API_URL / NEXT_PUBLIC_GOOGLE_CLIENT_ID
    # are missing (next lint/build load the config with NODE_ENV=production).
    # Dummy values are enough for lint/build; real values come from deploy env.
    env:
      NEXT_PUBLIC_API_URL: "https://ci.example.com"
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: "ci-dummy.apps.googleusercontent.com"
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Type check
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
